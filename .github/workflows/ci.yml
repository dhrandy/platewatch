name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test core
        run: dotnet test tests/PlateWatch.Tests -c Release

  build-app:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore src/PlateWatch.App
      - name: Build WinUI 3 app
        run: dotnet build src/PlateWatch.App -c Release --no-restore -p:Platform=x64
      - name: Publish single-file exe
        run: >-
          dotnet publish src/PlateWatch.App -c Release -r win-x64
          -p:Platform=x64 -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: platewatch-app
          path: publish/
