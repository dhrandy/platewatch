name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test core
        run: dotnet test tests/PlateWatch.Tests -c Release

  build-app:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore src/PlateWatch.App
      - name: Build WinUI 3 app
        run: dotnet build src/PlateWatch.App -c Release --no-restore -p:Platform=x64
      - name: Publish self-contained app
        run: >-
          dotnet publish src/PlateWatch.App -c Release -r win-x64
          -p:Platform=x64
          -p:SelfContained=true
          -o publish
      - name: List publish resource files
        shell: pwsh
        run: |
          $pri = Get-ChildItem publish -Recurse -Include *.pri,*.xbf -File | Select-Object -ExpandProperty FullName
          Write-Host "::warning::pri/xbf => $($pri -join ', ')"
          $rt = Get-ChildItem publish -File | Where-Object { $_.Name -match 'WindowsAppRuntime|WindowsAppSDK|Microsoft.UI.Xaml' } | Select-Object -ExpandProperty Name
          Write-Host "::warning::winappsdk files => $($rt -join ', ')"
      - name: Copy WinAppSDK insights resource dll (self-contained gap)
        shell: pwsh
        run: |
          Write-Host "::warning::STEP insights-copy start"
          $pkgRoot = "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk.runtime"
          $pkg = Get-ChildItem $pkgRoot | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $msix = Join-Path $pkg.FullName "tools\MSIX\win10-x64\Microsoft.WindowsAppRuntime.2.msix"
          $zip = "$env:RUNNER_TEMP\war.zip"
          Copy-Item $msix $zip
          $dst = "$env:RUNNER_TEMP\war-msix"
          Expand-Archive $zip $dst -Force
          Copy-Item (Join-Path $dst "Microsoft.WindowsAppRuntime.Insights.Resource.dll") publish\
          if (-not (Test-Path "publish\Microsoft.WindowsAppRuntime.Insights.Resource.dll")) { Write-Host "::error::insights resource dll copy failed"; exit 1 }
          Write-Host "::warning::STEP insights-copy done"
      - name: Smoke test first launch
        shell: pwsh
        run: |
          Write-Host "::warning::STEP smoke start"
          $exe = "publish\PlateWatch.App.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::publish exe missing"; exit 1 }
          $key = (Get-ChildItem publish -File | Where-Object { $_.Extension -in '.pri','.xbf' -or $_.Name -match 'PlateWatch|resources' } | Select-Object -ExpandProperty Name) -join ', '
          Write-Host "::warning::publish key files => $key"
          # Environment.GetFolderPath(ApplicationData) resolves the real profile
          # path, not an %APPDATA% override - read the log from there
          $logDir = "$env:USERPROFILE\AppData\Roaming\PlateWatch"
          Remove-Item $logDir -Recurse -Force -ErrorAction SilentlyContinue
          $env:PLATEWATCH_XAML_PROBE = "1"
          try { $p = Start-Process $exe -PassThru -ErrorAction Stop }
          catch { Write-Host "::error::Start-Process failed: $_"; exit 1 }
          Start-Sleep -Seconds 12
          $log = Join-Path $logDir "startup.log"
          $content = Get-Content $log -Raw -ErrorAction SilentlyContinue
          Write-Host "::warning::startup.log => $($content -replace '\r?\n', ' | ' -replace '%', '%25')"
          # visual QA: capture the desktop while the app window is up
          try {
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $full = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $gr = [System.Drawing.Graphics]::FromImage($full)
            $gr.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $full.Size)
            $full.Save("smoke-screenshot.png")
            $h = [int]($b.Height * (640.0 / $b.Width))
            $thumb = $full.GetThumbnailImage(640, $h, $null, [IntPtr]::Zero)
            $ms = New-Object System.IO.MemoryStream
            $jpeg = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
            $ep = New-Object System.Drawing.Imaging.EncoderParameters(1)
            $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter([System.Drawing.Imaging.Encoder]::Quality, [long]60)
            $thumb.Save($ms, $jpeg, $ep)
            # annotation caps: ~4KB per message, 10 per level per step - chunk and
            # spill past chunk 09 into the warning budget (smoke uses ~3)
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            for ($i = 0; $i -lt $b64.Length; $i += 3800) {
              $n = [Math]::Min(3800, $b64.Length - $i)
              $lvl = if ($i -lt 38000) { 'notice' } else { 'warning' }
              Write-Host ("::{0}::shot-part-{1:d2} => {2}" -f $lvl, [int]($i/3800), $b64.Substring($i, $n))
            }
          } catch { Write-Host "::warning::screenshot failed: $_" }
          if ($p.HasExited) {
            Write-Host "::error::app exited during smoke test (code $($p.ExitCode))"
            $since = (Get-Date).AddMinutes(-3)
            Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001,1026; StartTime=$since} -ErrorAction SilentlyContinue |
              ForEach-Object {
                $m = ($_.Message -replace '\r?\n',' | ')
                if ($m.Length -gt 1100) { $m = $m.Substring(0,1100) }
                Write-Host ("::warning::wer" + $_.Id + " => " + ($m -replace '%','%25'))
              }
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          if ($content -notmatch 'window shown') { Write-Host "::error::window was not shown"; exit 1 }
          if ($content -match 'ERROR|FATAL') { Write-Host "::error::startup log contains ERROR/FATAL"; exit 1 }
      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke-screenshot.png
          if-no-files-found: ignore
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: platewatch-app
          path: publish/
