name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test core
        run: dotnet test tests/PlateWatch.Tests -c Release

  build-app:
    runs-on: windows-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore src/PlateWatch.App
      - name: Build WinUI 3 app
        run: dotnet build src/PlateWatch.App -c Release --no-restore -p:Platform=x64
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: platewatch-app
          path: src/PlateWatch.App/bin/x64/Release/net10.0-windows10.0.22621.0/
